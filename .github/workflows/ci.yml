name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  checks:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Test Symphony admission hooks
        run: python3 -m unittest discover -s tests/symphony -v
      - name: Test release packaging and dependency notices
        run: python3 -m unittest discover -s tests/release -v
      - name: Verify Cargo package contents
        run: |
          package_files="$(cargo package --list)"
          for required in README.md LICENSE Cargo.toml src/lib.rs src/main.rs; do
            printf '%s\n' "$package_files" | grep -Fqx "$required"
          done
      - name: Smoke-test Cargo installation
        run: |
          install_root="$RUNNER_TEMP/tunnel-deck-cargo-install"
          cargo install --path . --locked --root "$install_root"
          "$install_root/bin/tdeck" --version
          "$install_root/bin/tdeck" --help
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features
      - name: Run isolated Apple OpenSSH integration probe
        if: runner.os == 'macOS'
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: |
          sw_vers
          uname -m
          /usr/bin/python3 experiments/openssh_probe.py
