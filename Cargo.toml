[package]
name = "tunnel-deck"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal interface and CLI for managing SSH port forwarding"
license = "MIT"
repository = "https://github.com/kshiva1126/tunnel-deck"

[[bin]]
name = "tdeck"
path = "src/main.rs"

[dependencies]
libc = "0.2"
glob = "0.3"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
