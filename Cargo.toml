[package]
name = "tunnel-deck"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal interface and CLI for managing SSH port forwarding"
license = "MIT"
repository = "https://github.com/kshiva1126/tunnel-deck"

[[bin]]
name = "tdeck"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
